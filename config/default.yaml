# Equipoise default configuration. Every tunable number lives here or in
# costs.yaml / synthetic.yaml and is loaded through src/equipoise/config.py.
project: equipoise
seed: 42

paths:                                # relative to the repository root
  raw_dir: "data/raw/Data Tables - Text files"
  analysis_csv: data/protocolT_analysis.csv
  visits_csv: data/protocolT_visits.csv
  synthetic_dir: data/synthetic
  synthetic_reports_dir: reports/synthetic   # --synthetic runs never overwrite real outputs
  splits_json: data/splits.json
  models_dir: models
  figures_dir: reports/figures
  tables_dir: reports/tables
  logs_dir: logs

split:
  test_fraction: 0.2                  # fixed held-out test set, touched only for final reporting
  n_folds: 5                          # CV / cross-fitting folds inside the training 80%
  stratify_by: treatment

analysis:
  primary_outcome: Y_va_change_wk52
  arms: [Aflibercept, Bevacizumab, Ranibizumab]
  reference_arm: Bevacizumab          # cheapest; effects are reported as arm - Bevacizumab
  mcid_letters: 5                     # equipoise threshold (one ETDRS chart line)
  responder_threshold_letters: 15     # "gained >= 15 letters" classification target
  bootstrap_reps: 200

trial:                                # facts the real data must match (checked by schema.py)
  n_patients: 660
  arm_sizes: {Aflibercept: 224, Bevacizumab: 218, Ranibizumab: 218}
  n_missing_wk52: 44
  va_below_69_cutoff: 68              # X_va_below_69 = 1  <=>  X_va_letters <= 68 (20/50 or worse)

visits:                               # visit table (scripts/build_protocolT_visits.py)
  baseline_label: baseline
  wk52_label: wk52
  wk104_label: wk104
  year1_end_day: 364                  # year 1 = visits before the week-52 visit (this day if none)
  # PROVISIONAL windows - confirm against the Protocol T visit windows (Protocol PDF):
  oct_match_window_days: 14           # an OCT grading attaches to the nearest visit within +/- 14 d
  event_match_window_days: 3          # an injection / laser attaches to the nearest visit within +/- 3 d
  crosscheck_tolerance_letters: 0.5   # visit-derived vs analysis-table week-52 change

features:                             # baseline feature groups used by build_preprocessor
  continuous: [X_age, X_bmi, X_sbp, X_dbp, X_diabetes_duration_yrs, X_hba1c, X_log_uacr,
               X_va_letters, X_fellow_va_letters, X_iop, X_dr_severity_rc]
  log_transform: [X_hba1c]            # skewed lab (skewness ~1.0); X_log_uacr is already logged
  binary: [X_female, X_hispanic, X_insulin, X_smoker_current, X_hypertension, X_prior_mi, X_cad,
           X_prior_stroke, X_renal_disease, X_subretinal_fluid, X_epiretinal_membrane,
           X_pseudophakic, X_prior_dme_trt, X_prior_antivegf, X_prior_focal_laser, X_prior_prp,
           X_va_below_69]
  nominal: [X_race, X_diabetes_type, X_oct_machine]
  ordinal:
    X_dr_severity_clinical: [Microaneurysms only, Mild/moderate NPDR, Severe NPDR,
                             PDR and/or prior scatter]
  cst: {value: X_cst_um, machine: X_oct_machine}

preprocess:
  imputer: knn                        # knn | median | iterative (numeric columns, fitted on train only)
  knn_neighbors: 5
  sparse_threshold: 0.0               # 0 -> dense output; one-hot block alone is available as scipy.sparse
  cst_min_machine_n: 20               # machines with fewer training eyes use pooled mean/SD
  missing:
    n_imputations: 20                 # MICE imputations pooled with Rubin's rules
    mice_max_iter: 10
    knn_neighbors: 5
    impute_within_arm: true           # keeps arm x covariate interactions in the imputation model
  outliers:
    iqr_k: 1.5
    isolation_contamination: 0.05
    dbscan_min_samples: 10
    dbscan_eps_quantile: 0.95         # eps = this quantile of the k-distance curve
  bands:
    X_hba1c: {edges: [0, 7.0, 8.0, 9.0, 100], labels: ["<7", "7-8", "8-9", ">=9"]}
    X_va_letters: {edges: [0, 54, 68, 100], labels: ["<=54 (20/80 or worse)", "55-68 (20/63-20/50)", ">=69 (20/40 or better)"]}
    X_age: {edges: [0, 50, 60, 70, 120], labels: ["<50", "50-59", "60-69", ">=70"]}
    X_cst_um_harm: {edges: [-100, -0.5, 0.5, 100], labels: ["thin (z<-0.5)", "typical", "thick (z>0.5)"]}

stats:
  alpha: 0.05
  skew_threshold: 1.0                 # Table 1: |skew| above this -> median [IQR] and Kruskal-Wallis
  # Denominators that reproduce README 9.1: vision means use all observed values;
  # year-1 laser / injections use patients with a week-52 visit, 2-year ones a week-104 visit.
  yr1_population: M_has_wk52
  yr2_population: M_has_wk104
  regression_covariates: [X_cst_um_harm, X_age, X_hba1c, X_prior_antivegf, X_insulin]
  correlation_features: [X_age, X_bmi, X_sbp, X_dbp, X_diabetes_duration_yrs, X_hba1c, X_log_uacr,
                         X_va_letters, X_fellow_va_letters, X_iop, X_dr_severity_rc, X_cst_um]
  replication_tolerance_letters: 0.2
  replication_targets:                # README 9.1 "Our table" (complete cases)
    mean_gain_wk52: {Aflibercept: 13.3, Bevacizumab: 9.4, Ranibizumab: 11.2}
    mean_gain_wk52_va_below_69: {Aflibercept: 19.1, Bevacizumab: 11.8, Ranibizumab: 14.2}
    mean_gain_wk52_va_69_plus: {Aflibercept: 7.8, Bevacizumab: 7.0, Ranibizumab: 8.3}
    median_inj_yr1: {Aflibercept: 9, Bevacizumab: 10, Ranibizumab: 10}
    laser_yr1_pct: {Aflibercept: 37, Bevacizumab: 56, Ranibizumab: 47}
    cst_change_wk52: {Aflibercept: -165, Bevacizumab: -98, Ranibizumab: -147}
    mean_gain_wk104: {Aflibercept: 12.9, Bevacizumab: 9.6, Ranibizumab: 12.2}
    median_inj_total: {Aflibercept: 15, Bevacizumab: 16, Ranibizumab: 15}
    laser_any_pct: {Aflibercept: 41, Bevacizumab: 64, Ranibizumab: 52}

represent:                            # M3 (exploratory; training set only)
  n_components: 10                    # PCA components kept for the scree plot
  k_range: [2, 3, 4, 5, 6, 7, 8]      # k-means / Ward candidates; k chosen by best silhouette
  kmeans_n_init: 20
  dbscan_min_samples: 10
  dbscan_eps_quantile: 0.90
  min_arm_n_per_cluster: 10           # clusters with fewer patients per arm get no effect estimate
  apriori:
    min_support: 0.10
    min_confidence: 0.30
    max_len: 3
    top_n: 10
    binary_items: [X_female, X_insulin, X_hypertension, X_prior_dme_trt, X_prior_antivegf,
                   X_prior_focal_laser, X_subretinal_fluid, X_epiretinal_membrane,
                   X_pseudophakic, X_renal_disease]

supervised:                           # M5 outcome models (tuned by CV on the training 80 %)
  responder_target: gain_ge_15        # derived: Y_va_change_wk52 >= responder_threshold_letters
  laser_population: M_has_wk52        # Y_laser_yr1 modelled on patients with a week-52 visit
  count_population: M_has_wk52        # Y_n_inj_yr1 likewise
  cv_scoring_regression: neg_root_mean_squared_error
  cv_scoring_classification: roc_auc
  regression:
    ols: {}
    ridge: {alpha: [0.1, 1.0, 10.0, 100.0]}
    lasso: {alpha: [0.01, 0.05, 0.1, 0.5, 1.0]}
    knn: {n_neighbors: [5, 15, 30, 50], weights: [uniform, distance]}
    decision_tree: {max_depth: [2, 3, 4, 6], min_samples_leaf: [10, 20, 40]}
    random_forest: {n_estimators: [300], max_depth: [3, 6, null], min_samples_leaf: [5, 20]}
    gradient_boosting: {n_estimators: [100, 300], learning_rate: [0.02, 0.05], max_depth: [2, 3]}
  classification:
    logistic: {C: [0.01, 0.1, 1.0, 10.0]}
    knn: {n_neighbors: [5, 15, 30, 50]}
    decision_tree: {max_depth: [2, 3, 4, 6], min_samples_leaf: [10, 20, 40]}
    gaussian_nb: {}
    bernoulli_nb: {alpha: [0.5, 1.0, 2.0]}
  irls:
    max_iter: 50
    tol: 1.0e-8
    l2: 1.0e-4                        # tiny ridge so the full one-hot design stays invertible
  knn_timing:
    algorithms: [kd_tree, ball_tree, brute]
    n_neighbors: 15
    repeats: 20
  count:
    poisson_glm: {alpha: [0.0001, 0.01, 0.1, 1.0]}
    gradient_boosting_poisson: {max_iter: [100, 300], learning_rate: [0.03, 0.1], max_depth: [2, 3]}

tracking:
  mlflow_tracking_uri: mlruns         # local file store, relative to the repository root
  experiment_prefix: equipoise
