[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "equipoise"
version = "0.1.0"
description = "Explainable, cost-aware treatment-choice assistant for DME, learned from DRCR Protocol T (research prototype, not for clinical use)."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "scipy>=1.11",
    "scikit-learn>=1.4",
    "pyyaml>=6.0",
    "typer>=0.12",
    "mlflow>=2.14",
    "matplotlib>=3.8",
    "tabulate>=0.9",
    "pydantic>=2.6",
    "statsmodels>=0.14",
    "mlxtend>=0.23",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.5", "dvc>=3.50"]
automl = ["autogluon.tabular>=1.1"]
cv = [
    "opencv-python-headless>=4.9",
    "torch>=2.2",
    "torchvision>=0.17",
    "ultralytics>=8.2",
    "grad-cam>=1.5",
    "gradio>=4.0",
    "kaggle>=1.6",
]

[project.scripts]
equipoise = "equipoise.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning:mlflow.*"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "scripts", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "D"]
ignore = ["D105", "D107", "D203", "D213", "D413"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D"]
