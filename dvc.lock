          - X_diabetes_type
          - X_oct_machine
          ordinal:
            X_dr_severity_clinical:
            - Microaneurysms only
            - Mild/moderate NPDR
            - Severe NPDR
            - PDR and/or prior scatter
          cst:
            value: X_cst_um
            machine: X_oct_machine
        preprocess:
          imputer: knn
          knn_neighbors: 5
          sparse_threshold: 0.0
          cst_min_machine_n: 20
          missing:
            n_imputations: 20
            mice_max_iter: 10
            knn_neighbors: 5
            impute_within_arm: true
          outliers:
            iqr_k: 1.5
            isolation_contamination: 0.05
            dbscan_min_samples: 10
            dbscan_eps_quantile: 0.95
          bands:
            X_hba1c:
              edges:
              - 0
              - 7.0
              - 8.0
              - 9.0
              - 100
              labels:
              - <7
              - 7-8
              - 8-9
              - '>=9'
            X_va_letters:
              edges:
              - 0
              - 54
              - 68
              - 100
              labels:
              - <=54 (20/80 or worse)
              - 55-68 (20/63-20/50)
              - '>=69 (20/40 or better)'
            X_age:
              edges:
              - 0
              - 50
              - 60
              - 70
              - 120
              labels:
              - <50
              - 50-59
              - 60-69
              - '>=70'
            X_cst_um_harm:
              edges:
              - -100
              - -0.5
              - 0.5
              - 100
              labels:
              - thin (z<-0.5)
              - typical
              - thick (z>0.5)
